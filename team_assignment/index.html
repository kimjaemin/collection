<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 반 팀 추첨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --ground: #EEF1F6;
  --grid: #DDE3EC;
  --surface: #FFFFFF;
  --ink: #171B26;
  --muted: #5B6476;
  --line: #CBD2DE;
  --team-a: #2747C4;
  --team-b: #D9472A;
  --team-c: #13805F;
  --team-d: #B7860C;
  --tint-a: #E4E9FB;
  --tint-b: #FBE6E1;
  --tint-c: #DDF2EA;
  --tint-d: #F8EED3;
  --danger: #B42318;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #10141C; --grid: #1A2030; --surface: #191F2C; --ink: #E9EDF5;
    --muted: #98A2B6; --line: #2C3547;
    --team-a: #7D95FF; --team-b: #FF8466; --team-c: #45C99B; --team-d: #E9B949;
    --tint-a: #1E2748; --tint-b: #3A211C; --tint-c: #15322A; --tint-d: #352B14;
    --danger: #FF8A80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #10141C; --grid: #1A2030; --surface: #191F2C; --ink: #E9EDF5;
  --muted: #98A2B6; --line: #2C3547;
  --team-a: #7D95FF; --team-b: #FF8466; --team-c: #45C99B; --team-d: #E9B949;
  --tint-a: #1E2748; --tint-b: #3A211C; --tint-c: #15322A; --tint-d: #352B14;
  --danger: #FF8A80;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--ground);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 48px; display: grid; gap: 20px; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--team-a); outline-offset: 2px; }

/* ---------- 헤더 ---------- */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 .dots { display: inline-flex; gap: 6px; vertical-align: middle; margin-left: 10px; }
h1 .dots i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.sub { margin: 6px 0 0; color: var(--muted); }
.progress { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 14px; }
.progress b { font-family: var(--display); font-weight: 400; color: var(--ink); font-size: 34px; line-height: 1; }

/* ---------- 설정 패널 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; }
.setup { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 820px) { .setup { grid-template-columns: 1fr; } }
.setup h2 { font-size: 16px; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.tag { display: inline-block; font-size: 11px; letter-spacing: 0.06em; border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); margin-left: 6px; vertical-align: 2px; }
textarea { width: 100%; min-height: 250px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--ground); font-family: var(--mono); font-size: 14px; line-height: 1.7; }
.count { margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count.ok { color: var(--team-c); }
.fix-row { display: flex; flex-wrap: wrap; gap: 8px; }
.fix-row select { flex: 1 1 140px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--ground); }
.team-pick { display: flex; gap: 6px; }
.team-pick button { width: 42px; height: 42px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); font-family: var(--display); font-size: 20px; }
.team-pick button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.team-pick button[data-t="A"][aria-pressed="true"] { background: var(--team-a); }
.team-pick button[data-t="B"][aria-pressed="true"] { background: var(--team-b); }
.team-pick button[data-t="C"][aria-pressed="true"] { background: var(--team-c); }
.team-pick button[data-t="D"][aria-pressed="true"] { background: var(--team-d); }
.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; background: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.big { font-size: 18px; padding: 14px 26px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 36px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border-radius: 999px; background: var(--ground); border: 1px solid var(--line); font-size: 14px; }
.chip .letter { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-size: 14px; }
.chip button { border: 0; background: none; color: var(--muted); padding: 0 6px; font-size: 16px; line-height: 1; }
.empty { color: var(--muted); font-size: 13px; }
.error { color: var(--danger); font-size: 14px; font-weight: 500; margin: 0; }
.rules { margin: 16px 0 0; padding: 14px; border-radius: 10px; background: var(--ground); font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.rules strong { color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }

/* ---------- 추첨 무대 ---------- */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 18px; }
.stage-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.round-label { font-family: var(--display); font-size: 26px; }
.round-label small { font-family: var(--body); font-size: 14px; color: var(--muted); margin-left: 8px; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 640px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.slot { border: 2px dashed var(--line); border-radius: 12px; min-height: 150px; padding: 14px; display: grid; align-content: space-between; gap: 10px; background: var(--ground); transition: background-color .3s, border-color .3s; }
.slot.filled { border-style: solid; }
.slot .name { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; line-height: 1.2; word-break: keep-all; overflow-wrap: anywhere; }
.slot .pin { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.slot .result { font-family: var(--display); font-size: clamp(34px, 5vw, 56px); line-height: 1; color: var(--muted); }
.slot .result span { font-size: 0.45em; margin-left: 4px; }
.slot[data-t="A"] { background: var(--tint-a); border-color: var(--team-a); } .slot[data-t="A"] .result { color: var(--team-a); }
.slot[data-t="B"] { background: var(--tint-b); border-color: var(--team-b); } .slot[data-t="B"] .result { color: var(--team-b); }
.slot[data-t="C"] { background: var(--tint-c); border-color: var(--team-c); } .slot[data-t="C"] .result { color: var(--team-c); }
.slot[data-t="D"] { background: var(--tint-d); border-color: var(--team-d); } .slot[data-t="D"] .result { color: var(--team-d); }
.slot.land .result { animation: land .45s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes land { from { transform: scale(1.6); } to { transform: scale(1); } }
.slot.idle { display: grid; place-items: center; color: var(--muted); font-size: 14px; text-align: center; }
.banner { margin: 0; padding: 14px 16px; border-radius: 10px; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 18px; }

/* ---------- 팀 보드 ---------- */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .board { grid-template-columns: 1fr; } }
.team { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.team-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; color: #fff; }
.team-head .t { font-family: var(--display); font-size: 34px; line-height: 1; }
.team-head .t span { font-size: 18px; margin-left: 2px; }
.team-head .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.team[data-t="A"] .team-head { background: var(--team-a); }
.team[data-t="B"] .team-head { background: var(--team-b); }
.team[data-t="C"] .team-head { background: var(--team-c); }
.team[data-t="D"] .team-head { background: var(--team-d); }
:root:not([data-theme="light"]) .team-head { color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .team-head, :root:not([data-theme="light"]) .team-pick button[aria-pressed="true"], :root:not([data-theme="light"]) .chip .letter { color: #10141C; } }
:root[data-theme="dark"] .team-head, :root[data-theme="dark"] .team-pick button[aria-pressed="true"], :root[data-theme="dark"] .chip .letter { color: #10141C; }
.team ol { list-style: none; margin: 0; padding: 8px 0; counter-reset: m; min-height: 120px; }
.team li { counter-increment: m; display: flex; align-items: baseline; gap: 10px; padding: 5px 16px; font-size: 16px; }
.team li::before { content: counter(m, decimal-leading-zero); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.team li .fx { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.team li.new { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--grid); } to { background: transparent; } }
.team.big { outline: 3px solid var(--ink); outline-offset: -3px; }
.bottom { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.toast { font-size: 13px; color: var(--muted); align-self: center; }

@media (prefers-reduced-motion: reduce) {
  .slot.land .result, .team li.new { animation: none; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>우리 반 팀 추첨<span class="dots" aria-hidden="true"><i style="background:var(--team-a)"></i><i style="background:var(--team-b)"></i><i style="background:var(--team-c)"></i><i style="background:var(--team-d)"></i></span></h1>
      <p class="sub">4명씩 뽑아 A·B·C·D팀에 한 명씩 배치합니다. 마지막에 남은 학생이 들어가는 팀은 11명이 됩니다.</p>
    </div>
    <div class="progress" aria-live="polite"><b id="placed">0</b> / <span id="total">0</span>명 배치</div>
  </header>

  <!-- 설정 -->
  <section class="panel setup" id="setup">
    <div>
      <h2>학생 명단 <span class="tag">예시</span></h2>
      <p class="hint">한 줄에 4명씩, 쉼표로 구분해서 입력하세요. 입력한 순서대로 4명씩 추첨합니다.</p>
      <textarea id="names" spellcheck="false" aria-label="학생 명단"></textarea>
      <div class="count" id="count"></div>
    </div>
    <div>
      <h2>팀 고정</h2>
      <p class="hint">미리 팀을 정해 둘 학생을 고르세요. 이 학생은 추첨 때 정해 둔 팀으로 들어갑니다.</p>
      <div class="fix-row">
        <select id="fix-name" aria-label="고정할 학생"></select>
        <div class="team-pick" id="fix-team" role="group" aria-label="고정할 팀">
          <button type="button" data-t="A" aria-pressed="true">A</button>
          <button type="button" data-t="B" aria-pressed="false">B</button>
          <button type="button" data-t="C" aria-pressed="false">C</button>
          <button type="button" data-t="D" aria-pressed="false">D</button>
        </div>
        <button type="button" class="btn" id="fix-add">고정</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="rules">
        <div><strong>팀 인원</strong> 41명 기준 10명 팀 3개, 11명 팀 1개</div>
        <div><strong>배치 방식</strong> 뽑힌 4명은 서로 다른 팀으로 들어감</div>
        <div><strong>11명 팀</strong> 추첨 시작 때 무작위로 정해지며 마지막 차례에 공개됨</div>
      </div>
    </div>
    <div class="actions" style="grid-column: 1 / -1">
      <button type="button" class="btn big" id="start">추첨 시작</button>
      <p class="error" id="error" role="alert"></p>
    </div>
  </section>

  <!-- 추첨 무대 -->
  <section class="stage" id="stage" hidden>
    <div class="stage-top">
      <div class="round-label" id="round-label"></div>
      <div class="actions">
        <button type="button" class="btn big" id="next">다음 4명 뽑기</button>
        <button type="button" class="btn ghost" id="auto">끝까지 자동 진행</button>
        <button type="button" class="btn ghost" id="reset">명단 수정</button>
      </div>
    </div>
    <div class="slots" id="slots"></div>
    <p class="banner" id="banner" hidden></p>
  </section>

  <section class="board" id="board" aria-label="팀 편성 현황"></section>
  <div class="bottom">
    <span class="toast" id="toast" aria-live="polite"></span>
    <button type="button" class="btn ghost" id="copy">결과 복사</button>
  </div>
</div>

<script>
(() => {
  const TEAMS = ["A", "B", "C", "D"];
  const GROUP = 4;
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? Math.min(ms, 120) : ms));

  // ---------- 예시 명단 ----------
  const SAMPLE = [];
  const sampleNames = ["김제민"];
  for (let i = 2; i <= 39; i++) sampleNames.push("학생" + String(i).padStart(2, "0"));
  sampleNames.push("청강생01", "청강생02");
  for (let i = 0; i < sampleNames.length; i += GROUP) SAMPLE.push(sampleNames.slice(i, i + GROUP).join(", "));

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  let fixed = new Map([["김제민", "A"]]);
  try {
    const saved = JSON.parse(store.get("team-draw-fixed") || "null");
    if (Array.isArray(saved)) fixed = new Map(saved);
  } catch (e) {}
  $("names").value = store.get("team-draw-names") || SAMPLE.join("\n");

  let pickTeam = "A";
  let plan = [];        // [[{name, team, fixed}], ...] 라운드별 결과
  let round = 0;
  let bigTeam = null;
  let busy = false;
  let autoRun = false;
  const teams = { A: [], B: [], C: [], D: [] };

  const parseNames = (text) => text.split(/[\n,，、]+/).map((s) => s.trim()).filter(Boolean);
  const shuffle = (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  // ---------- 배치 알고리즘 (team_assign.py 와 동일) ----------
  function buildPlan(names, fixedMap) {
    const base = Math.floor(names.length / TEAMS.length);
    const extra = names.length % TEAMS.length;
    const fixedCount = { A: 0, B: 0, C: 0, D: 0 };
    fixedMap.forEach((t) => fixedCount[t]++);
    const over = TEAMS.filter((t) => fixedCount[t] > base);
    if (TEAMS.some((t) => fixedCount[t] > base + 1) || over.length > extra) {
      throw new Error(`고정한 학생이 팀 정원보다 많습니다. 팀당 ${base}명까지 고정할 수 있고, ${base + 1}명까지 고정할 수 있는 팀은 ${extra}개입니다.`);
    }
    const big = over.concat(shuffle(TEAMS.filter((t) => !over.includes(t))).slice(0, extra - over.length));
    const cap = {}; TEAMS.forEach((t) => cap[t] = base + (big.includes(t) ? 1 : 0));
    const reserved = { ...fixedCount };
    const count = { A: 0, B: 0, C: 0, D: 0 };
    const rounds = [];
    for (let i = 0; i < names.length; i += GROUP) {
      const group = names.slice(i, i + GROUP);
      const used = new Set();
      const result = new Map();
      group.filter((n) => fixedMap.has(n)).forEach((n) => {
        const t = fixedMap.get(n);
        result.set(n, t); count[t]++; reserved[t]--; used.add(t);
      });
      shuffle(group.filter((n) => !fixedMap.has(n))).forEach((n) => {
        const open = TEAMS.filter((t) => cap[t] - count[t] - reserved[t] > 0);
        const preferred = open.filter((t) => !used.has(t));
        const t = pick(preferred.length ? preferred : open);
        result.set(n, t); count[t]++; used.add(t);
      });
      rounds.push(group.map((n) => ({ name: n, team: result.get(n), fixed: fixedMap.has(n) })));
    }
    return { rounds, big };
  }

  // ---------- 설정 화면 ----------
  function currentNames() { return parseNames($("names").value); }

  function refreshSetup() {
    const names = currentNames();
    const dupes = [...new Set(names.filter((n, i) => names.indexOf(n) !== i))];
    [...fixed.keys()].forEach((n) => { if (!names.includes(n)) fixed.delete(n); });

    const count = $("count");
    const rounds = Math.ceil(names.length / GROUP);
    count.textContent = `${names.length}명 입력됨 · ${rounds}번에 나눠 추첨` + (names.length === 41 ? " · 41명 확인" : ` · 41명과 ${names.length > 41 ? "+" : ""}${names.length - 41}명 차이`);
    count.className = "count" + (names.length === 41 && !dupes.length ? " ok" : "");
    $("error").textContent = dupes.length ? `이름이 중복되었습니다: ${dupes.join(", ")}. 동명이인은 '김민수A'처럼 구분해 주세요.` : "";

    const sel = $("fix-name");
    const prev = sel.value;
    sel.innerHTML = "";
    names.filter((n) => !fixed.has(n)).forEach((n) => sel.add(new Option(n, n)));
    if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    $("fix-add").disabled = !sel.options.length;

    const chips = $("chips");
    chips.innerHTML = "";
    if (!fixed.size) chips.innerHTML = '<span class="empty">고정한 학생이 없습니다. 모두 무작위로 배치됩니다.</span>';
    fixed.forEach((t, n) => {
      const c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = `<span class="letter" style="background:var(--team-${t.toLowerCase()})">${t}</span><span></span><button type="button" aria-label="${n} 고정 해제">×</button>`;
      c.children[1].textContent = n;
      c.querySelector("button").onclick = () => { fixed.delete(n); save(); refreshSetup(); };
      chips.append(c);
    });
    $("total").textContent = names.length;
    $("start").disabled = names.length < GROUP || dupes.length > 0;
    return { names, dupes };
  }

  function save() {
    store.set("team-draw-names", $("names").value);
    store.set("team-draw-fixed", JSON.stringify([...fixed]));
  }

  $("names").addEventListener("input", () => { save(); refreshSetup(); renderBoard(); });
  $("fix-team").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    pickTeam = b.dataset.t;
    $("fix-team").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("fix-add").addEventListener("click", () => {
    const n = $("fix-name").value; if (!n) return;
    fixed.set(n, pickTeam); save(); refreshSetup();
  });

  // ---------- 팀 보드 ----------
  function renderBoard(highlight = new Set(), final = false) {
    const board = $("board");
    board.innerHTML = "";
    TEAMS.forEach((t) => {
      const col = document.createElement("div");
      col.className = "team" + (final && t === bigTeam ? " big" : "");
      col.dataset.t = t;
      col.innerHTML = `<div class="team-head"><div class="t">${t}<span>팀</span></div><div class="n">${teams[t].length}명</div></div><ol></ol>`;
      const ol = col.querySelector("ol");
      teams[t].forEach((m) => {
        const li = document.createElement("li");
        if (highlight.has(m.name)) li.className = "new";
        li.append(m.name);
        if (m.fixed) { const f = document.createElement("span"); f.className = "fx"; f.textContent = "고정"; li.append(f); }
        ol.append(li);
      });
      board.append(col);
    });
    $("placed").textContent = TEAMS.reduce((s, t) => s + teams[t].length, 0);
  }

  // ---------- 추첨 진행 ----------
  function showIdleSlots(text) {
    $("slots").innerHTML = `<div class="slot idle" style="grid-column:1/-1">${text}</div>`;
  }

  function updateRoundLabel() {
    const total = plan.length;
    const label = $("round-label");
    label.textContent = round < total ? `${round + 1}번째 추첨` : "추첨 완료";
    const small = document.createElement("small");
    small.textContent = `${Math.min(round, total)} / ${total}회 진행`;
    label.append(small);
    $("next").disabled = busy || round >= total;
    $("auto").disabled = busy || round >= total;
    $("reset").disabled = busy;
  }

  async function drawRound() {
    if (busy || round >= plan.length) return;
    busy = true; updateRoundLabel();
    const group = plan[round];
    const slots = $("slots");
    slots.innerHTML = "";
    const els = group.map((m) => {
      const s = document.createElement("div");
      s.className = "slot filled";
      s.innerHTML = `<div><div class="name"></div><div class="pin">${m.fixed ? "고정 배치" : "&nbsp;"}</div></div><div class="result">?</div>`;
      s.querySelector(".name").textContent = m.name;
      slots.append(s);
      return s;
    });
    await sleep(350);

    // 한 명씩 팀 공개: 글자가 돌다가 멈춤
    for (let i = 0; i < group.length; i++) {
      const res = els[i].querySelector(".result");
      if (!reduceMotion) {
        const spins = 10 + i * 2;
        for (let k = 0; k < spins; k++) {
          const t = TEAMS[k % 4];
          res.textContent = t; els[i].dataset.t = t;
          await sleep(45 + k * 6);
        }
      }
      els[i].dataset.t = group[i].team;
      res.innerHTML = `${group[i].team}<span>팀</span>`;
      els[i].classList.remove("land"); void els[i].offsetWidth; els[i].classList.add("land");
      await sleep(260);
    }
    await sleep(500);

    group.forEach((m) => teams[m.team].push(m));
    round++;
    const final = round >= plan.length;
    renderBoard(new Set(group.map((m) => m.name)), final);
    if (final) {
      const banner = $("banner");
      banner.textContent = `추첨이 끝났습니다. ${bigTeam}팀이 ${teams[bigTeam].length}명, 나머지 팀은 ${teams[TEAMS.find((t) => t !== bigTeam)].length}명입니다.`;
      banner.hidden = !bigTeam;
    }
    busy = false; updateRoundLabel();
  }

  $("start").addEventListener("click", () => {
    const { names, dupes } = refreshSetup();
    if (dupes.length || names.length < GROUP) return;
    let built;
    try { built = buildPlan(names, fixed); }
    catch (err) { $("error").textContent = err.message; return; }
    plan = built.rounds;
    bigTeam = names.length % TEAMS.length === 1 ? built.big[0] : null;
    round = 0;
    TEAMS.forEach((t) => teams[t] = []);
    $("setup").hidden = true;
    $("stage").hidden = false;
    $("banner").hidden = true;
    showIdleSlots("‘다음 4명 뽑기’를 누르면 명단 순서대로 4명씩 팀이 공개됩니다.<br>스페이스바를 눌러도 됩니다.");
    renderBoard();
    updateRoundLabel();
    $("next").focus();
  });

  $("next").addEventListener("click", drawRound);
  $("auto").addEventListener("click", async () => {
    if (autoRun) return;
    autoRun = true;
    while (round < plan.length && autoRun) { await drawRound(); await sleep(500); }
    autoRun = false;
  });
  $("reset").addEventListener("click", () => {
    autoRun = false;
    TEAMS.forEach((t) => teams[t] = []);
    plan = []; round = 0;
    $("stage").hidden = true;
    $("setup").hidden = false;
    refreshSetup(); renderBoard();
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !$("stage").hidden && e.target.tagName !== "TEXTAREA" && e.target.tagName !== "SELECT") {
      e.preventDefault(); drawRound();
    }
  });

  $("copy").addEventListener("click", () => {
    const text = TEAMS.map((t) => `[${t}팀] ${teams[t].length}명\n` + teams[t].map((m, i) => `${i + 1}. ${m.name}${m.fixed ? " (고정)" : ""}`).join("\n")).join("\n\n");
    const done = (msg) => { $("toast").textContent = msg; setTimeout(() => $("toast").textContent = "", 2500); };
    if (!text.trim() || TEAMS.every((t) => !teams[t].length)) { done("아직 배치된 학생이 없습니다."); return; }
    navigator.clipboard.writeText(text).then(() => done("결과를 복사했습니다."), () => {
      const ta = document.createElement("textarea"); ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand("copy"); done("결과를 복사했습니다."); } catch (e) { done("복사하지 못했습니다. 팀 목록을 직접 선택해 복사해 주세요."); }
      ta.remove();
    });
  });

  refreshSetup();
  renderBoard();
})();
</script>
